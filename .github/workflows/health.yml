name: health

# The live app, checked the way a judge uses it, every 6 hours. A failed run emails the repository owner.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Production app answers like it should
        run: python backend/scripts/healthcheck.py https://comprende.vercel.app
